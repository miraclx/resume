name: release

# Build and release the resume PDF on version tags only — never on every commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst 0.15.1
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Fetch Inter
        run: |
          mkdir -p fonts
          curl -gfsSL -o fonts/Inter.ttf        "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          curl -gfsSL -o fonts/Inter-Italic.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter-Italic%5Bopsz%2Cwght%5D.ttf"

      - name: Build PDF
        run: typst compile --font-path fonts resume.typ Miraculous-Owonubi-Resume.pdf

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: Miraculous-Owonubi-Resume.pdf

      # Push the freshly built PDF into the Pages site so miraclx.github.io serves it
      # in-browser, instantly on every tag. Uses a write-only deploy key scoped to the
      # site repo (secret SITE_DEPLOY_KEY); nothing is committed into this repo.
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          repository: miraclx/miraclx.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: _site

      - name: Sync PDF to site
        run: |
          cp Miraculous-Owonubi-Resume.pdf _site/Miraculous-Owonubi-Resume.pdf
          cd _site
          if git diff --quiet -- Miraculous-Owonubi-Resume.pdf; then
            echo "site PDF already current, nothing to sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Miraculous-Owonubi-Resume.pdf
            git commit -m "sync resume PDF from ${GITHUB_REF_NAME}"
            git push
          fi
